       <link rel="stylesheet" href="rabaed-clay.css">

   Switch language direction with <html dir="rtl"> — every rule below is
   written with logical properties, so the whole UI mirrors on its own.

   CONTENTS
     1. Tokens ................ :root custom properties
     2. Base .................. reset, body, headings
     3. Primitives ............ .clay .clay-sm .inset
     4. Buttons ............... .btn and variants
     5. Forms ................. .field .input .drop .tagbox
     6. Chips & tags .......... .chip .etag .tag
     7. Utilities ............. .muted .row .grow ...
     8. Shell ................. .app .topbar .brand .avatar .crumb
     9. Navigation ............ .seg .lang .ms (multi-select)
    10. Cards & tiles ......... .proj-card .tile .pour
    11. Table ................. table.tbl
    12. Timeline ............., .tl
    13. Modal ................. .overlay .modal .blk
    14. Media ................. .ph-grid .lightbox .file-pill
    15. Feedback .............. .toast .fab .empty .bell
    16. Print ................. A4 submittal sheet
    17. Responsive ............ <=720px
    18. Generic aliases ....... semantic names for new apps
   ============================================================================ */

/* ============================================================
   CLAYMORPHISM · TOMATO PALETTE
   ============================================================ */
:root{
  --bg:            #f7ece8;
  --surface:       #fdf4f1;
  --surface-2:     #f6e6e0;
  --ink:           #4a332e;
  --ink-soft:      #9c7a71;
  --ink-faint:     #c2a49c;

  --clay-tomato:   #ffb3a0;
  --clay-coral:    #ffcbb8;
  --clay-blush:    #ffd9d2;
  --clay-sand:     #ffe6c9;
  --clay-olive:    #d9e5c4;

  --accent:        #ff6347;   /* tomato */
  --accent-2:      #ff8f78;
  --accent-deep:   #e04a30;
  --accent-bg:     #ffe1d9;
  --accent-ink:    #c93d21;

  --ok:            #2f8f6a;  --ok-bg:     #d9f0e5;
  --warn:          #c07a12;  --warn-bg:   #ffeccb;
  --danger:        #c8323f;  --danger-bg: #ffdcdb;
  --info:          #3f7fb8;  --info-bg:   #dfeaf7;
  --idle:          #9c7a71;  --idle-bg:   #f0e2dc;

  --r-sm: 14px; --r-md: 20px; --r-lg: 28px; --r-xl: 36px;

  /* clay recipe, warmed */
  --clay:
    8px 8px 20px rgba(198,142,124,.42),
    -8px -8px 20px rgba(255,252,250,.95),
    inset 2px 2px 4px rgba(255,255,255,.85),
    inset -3px -3px 8px rgba(200,150,135,.20);
  --clay-sm:
    5px 5px 12px rgba(198,142,124,.34),
    -5px -5px 12px rgba(255,252,250,.92),
    inset 1px 1px 2px rgba(255,255,255,.8),
    inset -2px -2px 5px rgba(200,150,135,.16);
  --clay-press:
    inset 5px 5px 12px rgba(198,142,124,.45),
    inset -5px -5px 12px rgba(255,252,250,.92);
  --clay-in:
    inset 4px 4px 10px rgba(198,142,124,.32),
    inset -4px -4px 10px rgba(255,252,250,.95);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink);
  background:var(--bg);
  background-image:
    radial-gradient(1100px 700px at 10% -8%,  #ffe3d8 0%, transparent 55%),
    radial-gradient(900px 600px at 100% 0%,   #ffd6cb 0%, transparent 50%),
    radial-gradient(900px 700px at 50% 115%,  #fff0dc 0%, transparent 55%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
html[dir="rtl"] body{font-family:'IBM Plex Sans Arabic','Plus Jakarta Sans',system-ui,sans-serif}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.02em}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] h4{letter-spacing:0}
p{margin:0}

/* ---------- Scrollbars · clay groove ----------
   The bar is a pressed groove in the same clay as .inset, with a convex
   tomato pill riding in it. Applied with * so nested scroll areas (modals,
   tables, the notes pane) match the page bar instead of falling back to the
   browser default. */
*::-webkit-scrollbar{width:14px;height:14px}
*::-webkit-scrollbar-button{display:none}
*::-webkit-scrollbar-track{
  background:var(--surface-2);
  border-radius:99px;
  box-shadow:inset 2px 2px 5px rgba(198,142,124,.50),
             inset -2px -2px 4px rgba(255,255,255,.95);
}
*::-webkit-scrollbar-track:vertical{margin:6px 0}
*::-webkit-scrollbar-track:horizontal{margin:0 6px}
*::-webkit-scrollbar-thumb{
  min-height:34px;
  border:3px solid transparent;          /* keeps the groove visible around the pill */
  border-radius:99px;
  background:linear-gradient(145deg,#ffc4b3,var(--clay-tomato) 55%,#ff9d88) padding-box;
  /* inset only — an outer shadow would draw on the border box and sit off
     the pill by 3px */
  box-shadow:inset 1.5px 1.5px 2px rgba(255,255,255,.85),
             inset -1.5px -1.5px 3px rgba(200,120,100,.35);
}
*::-webkit-scrollbar-thumb:hover{
  background:linear-gradient(145deg,var(--accent-2),var(--accent)) padding-box;
}
*::-webkit-scrollbar-thumb:active{
  background:linear-gradient(145deg,var(--accent),var(--accent-deep)) padding-box;
}
*::-webkit-scrollbar-corner{background:transparent}
/* Firefox. Chromium ignores every ::-webkit-scrollbar rule on any element
   that sets scrollbar-color, so these are scoped to engines that have no
   ::-webkit-scrollbar at all. */
@supports not selector(::-webkit-scrollbar){
  html{scrollbar-width:thin;scrollbar-color:var(--clay-tomato) var(--surface-2)}
}

/* ---------- Clay primitives ---------- */
.clay{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--clay)}
.clay-sm{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--clay-sm)}
.inset{background:var(--surface-2);border-radius:var(--r-md);box-shadow:var(--clay-in)}

.btn{
  border:0;cursor:pointer;font-weight:700;letter-spacing:-.01em;
  padding:13px 22px;border-radius:var(--r-md);
  background:var(--surface);color:var(--ink);
  box-shadow:var(--clay-sm);
  transition:transform .14s ease, box-shadow .14s ease, filter .14s ease;
  display:inline-flex;align-items:center;gap:9px;justify-content:center;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.02)}
.btn:active{transform:translateY(1px);box-shadow:var(--clay-press)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--clay-sm)}
.btn-primary{
  background:linear-gradient(145deg,#ff7d63,#ec4b2c);color:#fff;
  box-shadow:6px 6px 16px rgba(236,75,44,.34),-5px -5px 14px rgba(255,252,250,.92),
             inset 2px 2px 4px rgba(255,255,255,.42),inset -3px -3px 8px rgba(160,40,20,.30);
}
.btn-ok{background:linear-gradient(145deg,#5ac199,#2f8f6a);color:#fff;
  box-shadow:6px 6px 16px rgba(47,143,106,.32),-5px -5px 14px rgba(255,252,250,.92),
             inset 2px 2px 4px rgba(255,255,255,.45),inset -3px -3px 8px rgba(10,90,65,.3)}
.btn-warn{background:linear-gradient(145deg,#ffc46b,#e09a1f);color:#5a3a07;
  box-shadow:6px 6px 16px rgba(224,154,31,.32),-5px -5px 14px rgba(255,252,250,.92),
             inset 2px 2px 4px rgba(255,255,255,.5),inset -3px -3px 8px rgba(150,90,10,.24)}
.btn-ghost{background:transparent;box-shadow:none;color:var(--ink-soft);padding:10px 14px}
.btn-ghost:hover{background:var(--surface);box-shadow:var(--clay-sm);color:var(--ink)}
.btn-sm{padding:9px 15px;border-radius:var(--r-sm);font-size:13px}
.btn-tiny{padding:6px 11px;border-radius:12px;font-size:11.5px;margin-top:8px;gap:5px}
.btn-block{width:100%}
.btn-icon{padding:11px;border-radius:50%;width:42px;height:42px}

.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);
  margin:0 0 7px;margin-inline-start:4px;text-transform:uppercase;letter-spacing:.06em}
html[dir="rtl"] .field label{text-transform:none;letter-spacing:0;font-size:12.5px}
.input,select.input,textarea.input{
  width:100%;padding:14px 16px;border:0;outline:0;
  border-radius:var(--r-md);background:var(--surface-2);
  box-shadow:var(--clay-in);color:var(--ink);font-weight:600;
  transition:box-shadow .18s ease;
}
.input::placeholder{color:var(--ink-faint);font-weight:500}
.input:focus{box-shadow:var(--clay-in),0 0 0 3px rgba(255,99,71,.3)}
select.input{appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239c7a71' stroke-width='3' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 16px center;padding-right:42px}
html[dir="rtl"] select.input{background-position:left 16px center;padding-right:16px;padding-left:42px}
textarea.input{resize:vertical;min-height:80px;line-height:1.5}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 13px;border-radius:999px;font-size:12px;font-weight:800;
  letter-spacing:.01em;white-space:nowrap;
  box-shadow:3px 3px 8px rgba(198,142,124,.28),-3px -3px 8px rgba(255,252,250,.88),
             inset 1px 1px 2px rgba(255,255,255,.6);
}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.chip-ok{background:var(--ok-bg);color:#227353}
.chip-warn{background:var(--warn-bg);color:#95600d}
.chip-danger{background:var(--danger-bg);color:#a92634}
.chip-info{background:var(--info-bg);color:#2c6394}
.chip-idle{background:var(--idle-bg);color:#8a6a61}
.chip-accent{background:var(--accent-bg);color:var(--accent-ink)}

.muted{color:var(--ink-soft)}
.faint{color:var(--ink-faint)}
.tiny{font-size:12px}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:12px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.hidden{display:none !important}
.mono{font-variant-numeric:tabular-nums}

/* ---------- Language switch ---------- */
.lang{display:flex;gap:3px;padding:4px;border-radius:14px;background:var(--surface-2);box-shadow:var(--clay-in)}
.lang button{border:0;background:transparent;padding:7px 11px;border-radius:10px;cursor:pointer;
  font-size:12px;font-weight:800;color:var(--ink-soft)}
.lang button.on{background:var(--surface);color:var(--accent-ink);box-shadow:var(--clay-sm)}

/* ============================================================
   LOGIN
   ============================================================ */
.login-wrap{min-height:100dvh;display:grid;place-items:center;padding:24px}
.logo-blob img{width:62px;height:auto;display:block}
.by-line{display:flex;align-items:center;justify-content:center;gap:8px;
  margin:14px 0 22px;font-size:11.5px;font-weight:700;color:var(--ink-faint)}
.by-line img{height:19px;width:auto;display:block}
.build-line{margin:9px 0 20px;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  color:var(--ink-faint);opacity:.5;direction:ltr;text-align:center}
.build-tag{position:fixed;inset-inline-end:10px;bottom:8px;z-index:40;
  font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.05em;
  color:var(--ink-faint);opacity:.38;pointer-events:none;user-select:none;direction:ltr}
@media print{.build-tag{display:none}}
.login-card{width:100%;max-width:430px;padding:30px 32px;background:var(--surface);
  border-radius:var(--r-xl);box-shadow:var(--clay);text-align:center}
.who-box{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);
  background:var(--surface-2);box-shadow:var(--clay-in)}
.logo-blob{
  width:88px;height:88px;margin:0 auto 18px;border-radius:28px;
  background:linear-gradient(145deg,#fffaf7,var(--clay-blush));
  display:grid;place-items:center;font-size:36px;
  box-shadow:8px 8px 18px rgba(198,142,124,.42),-6px -6px 16px rgba(255,252,250,.95),
             inset 3px 3px 6px rgba(255,255,255,.7),inset -4px -4px 10px rgba(205,90,60,.28);
}
.role-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px;margin-bottom:20px}
.role-opt{
  padding:15px 8px 13px;border-radius:var(--r-md);background:var(--surface);
  box-shadow:var(--clay-sm);cursor:pointer;text-align:center;border:0;
  transition:transform .15s ease,box-shadow .15s ease;
}
.role-opt .emo{font-size:23px;display:block;margin-bottom:6px}
.role-opt .lbl{font-size:11.5px;font-weight:800;color:var(--ink-soft);line-height:1.25}
.role-opt:hover{transform:translateY(-2px)}
.role-opt.on{box-shadow:var(--clay-press);background:var(--surface-2)}
.role-opt.on .lbl{color:var(--accent-ink)}
.hint-box{margin-top:20px;padding:13px 15px;border-radius:var(--r-md);
  background:var(--surface-2);box-shadow:var(--clay-in);font-size:11.5px;
  color:var(--ink-soft);text-align:start;line-height:1.7}
.err{color:var(--danger);font-size:13px;font-weight:700;margin-top:12px;min-height:18px}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{max-width:1320px;margin:0 auto;padding:22px 20px 90px}
.topbar{
  display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:20px;
  background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--clay);
}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.02em}
.brand .mark{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:19px;
  background:linear-gradient(145deg,#fffaf7,var(--clay-blush));overflow:hidden;
  box-shadow:4px 4px 10px rgba(198,142,124,.35),-3px -3px 8px rgba(255,252,250,.92),
             inset 2px 2px 4px rgba(255,255,255,.7)}
.brand .mark img{width:31px;height:auto;display:block}
.who{margin-inline-start:auto;display:flex;align-items:center;gap:11px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  font-weight:800;font-size:14px;background:linear-gradient(145deg,#ffdcc9,var(--clay-tomato));
  color:#a33f26;box-shadow:var(--clay-sm)}

/* ---------- Notification bell ---------- */
.bell-wrap{position:relative}
.bell{position:relative;overflow:visible}
.bell-dot{position:absolute;top:-3px;inset-inline-end:-3px;min-width:19px;height:19px;padding:0 5px;
  border-radius:99px;background:linear-gradient(145deg,#ff7d63,#ec4b2c);color:#fff;
  font-size:10.5px;font-weight:800;display:grid;place-items:center;
  box-shadow:0 2px 6px rgba(236,75,44,.5)}
.notif-panel{position:absolute;top:calc(100% + 12px);inset-inline-end:0;width:330px;max-height:70vh;
  overflow:auto;z-index:50;padding:10px;background:var(--surface);
  border-radius:var(--r-lg);box-shadow:var(--clay);animation:pop .18s ease}
.notif{display:flex;align-items:flex-start;gap:10px;width:100%;border:0;cursor:pointer;
  padding:11px 10px;border-radius:14px;background:transparent;text-align:start;margin-bottom:3px}
.notif:hover{background:var(--surface-2)}
.notif.unread{background:var(--accent-bg)}
.notif.unread:hover{filter:brightness(.98)}
.nt-emo{font-size:16px;flex:none;margin-top:1px}
.nt-msg{display:block;font-size:12.5px;font-weight:700;line-height:1.45}
.nt-meta{display:block;font-size:10.5px;font-weight:600;color:var(--ink-faint);margin-top:3px}

.crumb{display:flex;align-items:center;gap:9px;margin-bottom:16px;font-size:13px;color:var(--ink-soft);font-weight:600}
.crumb b{color:var(--ink)}

/* Project cards */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:18px}
.proj-card{padding:22px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--clay);
  cursor:pointer;transition:transform .16s ease;text-align:start;border:0;width:100%}
.proj-card:hover{transform:translateY(-4px)}
.proj-icon{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-size:24px;
  margin-bottom:14px;box-shadow:var(--clay-sm)}
.proj-stat{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

/* Summary tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-bottom:20px}
.tile{padding:17px 19px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--clay);
  border:0;cursor:pointer;text-align:start;width:100%;font-family:inherit;color:inherit;
  transition:transform .15s ease, box-shadow .15s ease}
.tile:hover{transform:translateY(-3px)}
.tile:active{transform:translateY(0)}
.tile.on{box-shadow:var(--clay),0 0 0 2.5px var(--accent)}
.tile.on .k{color:var(--accent-ink)}
.tile .v{font-size:29px;font-weight:800;line-height:1.1;letter-spacing:-.03em}
.tile .k{font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;
  letter-spacing:.06em;margin-top:5px}
html[dir="rtl"] .tile .k{text-transform:none;letter-spacing:0;font-size:12.5px}
.tile .bar{height:6px;border-radius:99px;margin-top:11px;background:var(--surface-2);box-shadow:var(--clay-in);overflow:hidden}
.tile .bar i{display:block;height:100%;border-radius:99px}

/* Toolbar */
.toolbar{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg-row{display:flex;overflow-x:auto;margin-bottom:18px;padding-bottom:2px}
.seg-row .seg{flex:none}
.search{flex:1;min-width:200px;position:relative}
.search .input{padding-inline-start:44px}
.search .ico{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);opacity:.5;font-size:15px}
.seg{display:flex;gap:4px;padding:5px;border-radius:var(--r-md);background:var(--surface-2);box-shadow:var(--clay-in)}
.seg button{border:0;background:transparent;padding:9px 14px;border-radius:13px;cursor:pointer;
  font-size:12.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--clay-sm)}

/* Advanced filter panel */
.adv{padding:16px 18px;margin-bottom:16px;background:var(--surface);
  border-radius:var(--r-lg);box-shadow:var(--clay);animation:pop .18s ease}
.adv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
/* multi-select dropdown */
.ms{position:relative}
.ms-btn{display:flex;align-items:center;gap:8px;cursor:pointer;text-align:start;font-weight:600}
.ms-btn.on{color:var(--accent-ink);box-shadow:var(--clay-in),0 0 0 2px rgba(255,99,71,.35)}
.ms-menu{position:absolute;top:calc(100% + 7px);inset-inline-start:0;inset-inline-end:0;z-index:35;
  background:var(--surface);border-radius:var(--r-md);box-shadow:var(--clay);
  padding:6px;max-height:238px;overflow:auto;animation:pop .16s ease;min-width:180px}
.ms-opt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;
  padding:9px 10px;border-radius:11px;cursor:pointer;font-size:13px;font-weight:600;
  text-align:start;color:inherit}
.ms-opt:hover{background:var(--surface-2)}
.ms-opt .box{width:18px;height:18px;border-radius:6px;flex:none;display:grid;place-items:center;
  font-size:10px;background:var(--surface-2);box-shadow:var(--clay-in);color:transparent}
.ms-opt.on .box{background:linear-gradient(145deg,#ff8f78,#ec4b2c);color:#fff;box-shadow:none}

.mem-row{display:flex;align-items:center;gap:9px;padding:9px 11px;margin-bottom:7px;
  border-radius:var(--r-sm);background:var(--surface);box-shadow:var(--clay-sm)}
.mem-row:not(.on){opacity:.62;box-shadow:none;background:transparent}
.mem-row .pick button{padding:6px 9px;font-size:14px;line-height:1}

.chip-x{border:0;background:transparent;cursor:pointer;color:inherit;opacity:.55;
  font-weight:800;font-size:11px;padding:0 0 0 3px;line-height:1}
.chip-x:hover{opacity:1}

/* Pour cards */
.pour-list{display:flex;flex-direction:column;gap:15px}
.pour{padding:20px 22px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--clay);
  cursor:pointer;transition:transform .16s ease}
.pour:hover{transform:translateY(-3px)}
.pour-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.pour-ref{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--accent-ink);text-transform:uppercase}
.pour-title{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.elem-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.etag{padding:6px 11px;border-radius:11px;background:var(--surface-2);box-shadow:var(--clay-in);
  font-size:11.5px;font-weight:700;color:var(--ink-soft)}
.mile-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}
.mile{padding:13px 15px;border-radius:var(--r-md);background:var(--surface-2);box-shadow:var(--clay-in)}
.mile .m-k{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--ink-faint);
  text-transform:uppercase;margin-bottom:8px}
html[dir="rtl"] .mile .m-k{text-transform:none;letter-spacing:0;font-size:11.5px}
.mile .m-due{font-size:11px;color:var(--ink-faint);font-weight:600;margin-top:7px}

/* ---------- Table view ---------- */
.tbl-wrap{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--clay);padding:8px;overflow-x:auto}
table.tbl{width:100%;border-collapse:separate;border-spacing:0 7px;min-width:880px}
table.tbl thead th{
  text-align:start;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-faint);padding:10px 12px 6px;white-space:nowrap;
}
html[dir="rtl"] table.tbl thead th{text-transform:none;letter-spacing:0;font-size:11.5px}
table.tbl thead th.c{text-align:center}
table.tbl tbody tr{cursor:pointer}
table.tbl tbody td{
  background:var(--surface-2);padding:12px 11px;vertical-align:middle;
  box-shadow:inset 0 2px 5px rgba(198,142,124,.15), inset 0 -2px 5px rgba(255,252,250,.85);
  transition:transform .14s ease, box-shadow .14s ease;
}
table.tbl tbody td:first-child{border-start-start-radius:var(--r-md);border-end-start-radius:var(--r-md)}
table.tbl tbody td:last-child{border-start-end-radius:var(--r-md);border-end-end-radius:var(--r-md)}
table.tbl tbody tr:hover td{background:var(--surface);box-shadow:var(--clay-sm)}
.t-ref{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.t-el{font-weight:800;font-size:13.5px;line-height:1.3}
.t-sub{font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-top:3px}
.t-date{font-weight:700;font-size:13px;white-space:nowrap}
.t-due{font-size:10.5px;font-weight:600;color:var(--ink-faint);margin-top:4px;white-space:nowrap}
.t-mile{text-align:center}
.t-count{font-weight:800;font-size:13px}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px 8px;font-size:12px;font-weight:700;color:var(--ink-soft)}

/* ---------- Admin panel ---------- */
table.tbl-adm{min-width:1020px}
.pick{display:flex;flex-wrap:wrap;gap:7px}
.pick button{border:0;cursor:pointer;padding:8px 12px;border-radius:12px;font-size:12.5px;font-weight:700;
  background:var(--surface);color:var(--ink-soft);box-shadow:var(--clay-sm);transition:transform .14s ease}
.pick button:hover{transform:translateY(-2px)}
.pick button.on{background:var(--accent-bg);color:var(--accent-ink);box-shadow:var(--clay-press)}
.pick.emo button{font-size:19px;padding:9px 11px;line-height:1}
.pick.tint button{width:34px;height:34px;padding:0;border-radius:11px}
.pick.tint button.on{outline:3px solid var(--accent);outline-offset:2px}
.act{display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end}
.act .btn{margin:0;white-space:nowrap}
html[dir="rtl"] .act{justify-content:flex-start}
.note-line{padding:12px 15px;border-radius:var(--r-md);background:var(--surface-2);
  box-shadow:var(--clay-in);font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:16px}

/* Timeline */
.tl{position:relative;padding-inline-start:26px;margin-top:6px}
.tl:before{content:'';position:absolute;inset-inline-start:7px;top:8px;bottom:8px;width:3px;border-radius:9px;
  background:var(--surface-2);box-shadow:var(--clay-in)}
.tl-item{position:relative;padding:0 0 18px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;inset-inline-start:-26px;top:2px;width:17px;height:17px;border-radius:50%;
  background:var(--surface);box-shadow:var(--clay-sm);display:grid;place-items:center;font-size:9px}
.tl-item.done .tl-dot{background:linear-gradient(145deg,#63c8a1,#2f8f6a);color:#fff}
.tl-item.now .tl-dot{background:linear-gradient(145deg,#ff8f78,#ec4b2c);color:#fff}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(105,62,50,.34);backdrop-filter:blur(7px);
  display:grid;place-items:center;padding:18px;z-index:60;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.modal{width:100%;max-width:720px;max-height:90dvh;overflow:auto;padding:26px;
  background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--clay);animation:pop .22s ease}
.modal-sm{max-width:470px}
.modal-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px}
.modal h3{font-size:20px}

/* Form blocks */
.blk{padding:17px;border-radius:var(--r-md);background:var(--surface-2);box-shadow:var(--clay-in);margin-bottom:13px}
.blk-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;gap:10px}
.n{font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--accent-ink);text-transform:uppercase}
html[dir="rtl"] .n{text-transform:none;letter-spacing:0;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.x{border:0;background:var(--surface);width:29px;height:29px;border-radius:50%;cursor:pointer;
  box-shadow:var(--clay-sm);color:var(--danger);font-weight:800;line-height:1;font-size:15px;flex:none}
.ticket-row{display:flex;gap:9px;margin-bottom:9px;align-items:center}

/* ---------- Tag input ---------- */
.tagbox{position:relative;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  min-height:52px;padding:8px 10px;border-radius:var(--r-md);
  background:var(--surface-2);box-shadow:var(--clay-in);cursor:text;
  transition:box-shadow .18s ease}
.tagbox.focus{box-shadow:var(--clay-in),0 0 0 3px rgba(255,99,71,.3)}
.tag{display:inline-flex;align-items:center;gap:7px;padding:6px 8px 6px 11px;
  border-radius:11px;font-size:12.5px;font-weight:700;white-space:nowrap;
  box-shadow:2px 2px 6px rgba(198,142,124,.22),-2px -2px 6px rgba(255,252,250,.8)}
html[dir="rtl"] .tag{padding:6px 11px 6px 8px}
.tag button{border:0;background:transparent;cursor:pointer;font-size:13px;line-height:1;
  font-weight:800;color:inherit;opacity:.5;padding:2px}
.tag button:hover{opacity:1}
.tag-input{border:0;background:transparent;outline:0;flex:1;min-width:100px;
  padding:7px 4px;font-weight:600;color:var(--ink)}
.tag-input::placeholder{color:var(--ink-faint);font-weight:500;font-size:13px}
.tag-menu{position:absolute;top:calc(100% + 7px);inset-inline-start:0;inset-inline-end:0;z-index:30;
  background:var(--surface);border-radius:var(--r-md);box-shadow:var(--clay);
  padding:6px;max-height:196px;overflow:auto}
.tag-opt{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;
  cursor:pointer;font-size:13px;font-weight:600}
.tag-opt.on,.tag-opt:hover{background:var(--surface-2)}
.tag-opt .sw{width:13px;height:13px;border-radius:4px;flex:none}
.tag-opt .new{font-size:11px;font-weight:800;color:var(--accent-ink);margin-inline-start:auto}
/* latin/numeric fields keep LTR order inside an RTL form */
html[dir="rtl"] .num{direction:ltr;text-align:right}

/* ---------- Site photos ---------- */
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.ph-item{position:relative;aspect-ratio:4/3;border-radius:var(--r-sm);overflow:hidden;
  box-shadow:var(--clay-sm);background:var(--surface)}
.ph-item img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.ph-del{position:absolute;top:5px;inset-inline-end:5px;width:24px;height:24px;border:0;border-radius:50%;
  cursor:pointer;background:rgba(255,252,250,.92);color:var(--danger);font-weight:800;font-size:12px;
  line-height:1;box-shadow:0 2px 6px rgba(120,70,55,.35)}
.lightbox{position:relative;max-width:min(94vw,1100px);max-height:92vh}
.lightbox img{max-width:100%;max-height:92vh;border-radius:var(--r-md);display:block;
  box-shadow:0 18px 50px rgba(80,40,30,.45)}
.lb-x{position:absolute;top:10px;inset-inline-end:10px;background:var(--surface)}

/* Dropzone */
.drop{padding:26px 20px;border-radius:var(--r-md);background:var(--surface-2);box-shadow:var(--clay-in);
  text-align:center;cursor:pointer;transition:box-shadow .16s ease}
.drop:hover{box-shadow:var(--clay-in),0 0 0 3px rgba(255,99,71,.25)}
.drop .big{font-size:32px;margin-bottom:9px;transition:transform .16s ease}
/* children must not swallow the drag events, or dragleave fires as the pointer
   crosses the icon and the highlight flickers */
.drop>*{pointer-events:none}
.drop.over{background:var(--danger-bg);box-shadow:var(--clay-in),0 0 0 3px rgba(255,99,71,.55)}
.drop.over .big{transform:translateY(-3px) scale(1.12)}
.file-pill{display:flex;align-items:center;gap:11px;padding:12px 15px;border-radius:var(--r-md);
  background:var(--surface);box-shadow:var(--clay-sm);margin-top:11px}
.file-pill .fi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:var(--danger-bg);font-size:15px;flex:none}

/* Toast */
.toast-wrap{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;
  display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none}
.toast{padding:13px 20px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--clay);
  font-weight:700;font-size:13.5px;animation:pop .2s ease;display:flex;gap:9px;align-items:center}

/* FAB */
.fab{position:fixed;inset-inline-end:24px;bottom:24px;z-index:40;padding:16px 24px;border-radius:22px;
  font-size:14.5px;box-shadow:8px 8px 20px rgba(236,75,44,.38),-5px -5px 14px rgba(255,252,250,.85),
  inset 2px 2px 4px rgba(255,255,255,.4),inset -3px -3px 8px rgba(160,40,20,.3)}

.empty{padding:52px 24px;text-align:center;color:var(--ink-soft)}
.empty .big{font-size:46px;margin-bottom:14px;opacity:.55}

/* ============================================================
   PRINT — submittal sheet
   ============================================================ */
#print-area{display:none}
@media print{
  @page{ size:A4; margin:14mm; }
  body{background:#fff !important;background-image:none !important;color:#000}
  #root,.toast-wrap,.overlay,.fab{display:none !important}
  #print-area{display:block !important;font-size:11px;color:#000}
  .pr-head{display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
  .pr-head h1{font-size:17px;margin:0}
  .pr-head .sub{font-size:11px;margin-top:3px}
  .pr-meta{font-size:10px;text-align:end;line-height:1.6}
  .pr-sec{margin:12px 0 4px;font-size:11px;font-weight:800;text-transform:uppercase;
    letter-spacing:.06em;border-bottom:1px solid #999;padding-bottom:3px}
  table.pr{width:100%;border-collapse:collapse;margin-bottom:6px}
  table.pr th,table.pr td{border:1px solid #999;padding:4px 6px;font-size:10.5px;text-align:start;
    vertical-align:top}
  table.pr th{background:#eee;font-weight:800}
  .pr-kv{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
  .pr-kv div{border:1px solid #999;padding:4px 6px;font-size:10.5px}
  .pr-kv b{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:#444}
  .pr-note{border:1px solid #999;padding:6px 8px;font-size:10.5px;margin-bottom:6px}
  .pr-photos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .pr-photos img{width:23%;border:1px solid #999}
  .pr-sign{display:flex;gap:10px;margin-top:22px}
  .pr-sign div{flex:1;border-top:1px solid #000;padding-top:5px;font-size:10px}
  .pr-sign b{display:block;font-size:11px;margin-bottom:16px}
  .pr-foot{margin-top:14px;font-size:9px;color:#555;border-top:1px solid #ccc;padding-top:5px}
}

@media (max-width:720px){
  .app{padding:14px 13px 90px}
  .grid2,.grid3,.mile-grid{grid-template-columns:1fr}
  .topbar{flex-wrap:wrap;padding:13px}
  .who .nm{display:none}
  .modal{padding:20px;border-radius:var(--r-lg)}
  .fab{inset-inline-end:14px;bottom:14px;padding:14px 20px}
}

/* ============================================================
   18. GENERIC ALIASES
   Semantic names so a new app doesn't have to borrow
   pour-tracker vocabulary. Same styles, friendlier names.
   ============================================================ */
.card        { padding:22px; background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--clay); }
.card-hover  { cursor:pointer; transition:transform .16s ease; }
.card-hover:hover { transform:translateY(-3px); }
.card-grid   { display:grid; grid-template-columns:repeat(auto-fill,minmax(285px,1fr)); gap:18px; }
.stat-grid   { display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:14px; margin-bottom:20px; }
.list        { display:flex; flex-direction:column; gap:15px; }
.list-card   { padding:20px 22px; background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--clay);
               cursor:pointer; transition:transform .16s ease; }
.list-card:hover { transform:translateY(-3px); }
.eyebrow     { font-size:11px; font-weight:800; letter-spacing:.1em; color:var(--accent-ink); text-transform:uppercase; }
html[dir="rtl"] .eyebrow { text-transform:none; letter-spacing:0; font-size:12px; }
.section-title { font-size:17px; font-weight:800; letter-spacing:-.02em; }
.well        { padding:17px; border-radius:var(--r-md); background:var(--surface-2); box-shadow:var(--clay-in); }
.divider     { height:3px; border-radius:9px; background:var(--surface-2); box-shadow:var(--clay-in); margin:18px 0; }

/* Accent tints — for category swatches, tag colours, project icons.
   Softer set (backgrounds behind dark ink): */
:root{
  --tint-1:#ffe0d6; --tint-2:#ffe9cf; --tint-3:#e7f2dc; --tint-4:#dcefe8;
  --tint-5:#dfeaf7; --tint-6:#eee0f3; --tint-7:#ffdfe6; --tint-8:#fdf0d2;
  --clay-sky:#cfe6ff;
}

/* ============================================================
   LANDING PAGE — additions composed from the clay primitives
   ============================================================ */
html{scroll-behavior:smooth}
body{min-height:100%;height:auto;overflow-x:clip}
.lp{max-width:1120px;margin:0 auto;padding:18px 18px 60px}

/* A grid item defaults to min-width:auto, so anything with an unbreakable
   minimum inside it (the folder tree, a long email) refuses to shrink and
   spills out of the page on a phone. Every grid in this file opts out. */
.grid2>*,.grid3>*,.hero>*,.feat-grid>*,.cc-row>*,.pain-grid>*,.steps>*,
.also>*,.data-wrap>*,.up-card>*,.mock-tiles>*,.mock-mile>*,.tick li>*{min-width:0}
.tree,.mock,.form-card,.card,.up-card{max-width:100%}

/* ---------- top bar ---------- */
.lp-top{position:sticky;top:0;z-index:50;padding-top:14px}
/* a frosted strip so page content does not scroll through the gap above the bar */
.lp-top:before{content:'';position:fixed;top:0;inset-inline:0;height:82px;pointer-events:none;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  -webkit-mask-image:linear-gradient(#000 22%,transparent 78%);mask-image:linear-gradient(#000 22%,transparent 78%)}
.lp-top .topbar{position:relative;margin-bottom:26px}
.brand .mark img{width:29px}
.brand .nm{display:block;font-size:15.5px;line-height:1.15}
.brand .sub{display:block;font-size:10.5px;font-weight:700;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
html[dir="rtl"] .brand .sub{text-transform:none;letter-spacing:0;font-size:11.5px}
.top-end{margin-inline-start:auto;display:flex;align-items:center;gap:10px}

/* ---------- generic section ---------- */
.sec{margin:64px 0 0}
.sec-head{max-width:660px;margin:0 auto 26px;text-align:center}
.sec-head h2{font-size:clamp(23px,3.4vw,31px);line-height:1.25;margin-top:9px}
.sec-head p{margin-top:11px;font-size:14.5px;font-weight:600;color:var(--ink-soft);line-height:1.75}
.eyebrow-c{display:inline-block}
a.btn{text-decoration:none}
section[id]{scroll-margin-top:96px}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:34px;align-items:center;margin-top:8px}
.hero h1{font-size:clamp(28px,4.6vw,44px);line-height:1.22}
.hero .lede{margin-top:16px;font-size:15.5px;font-weight:600;color:var(--ink-soft);line-height:1.8;max-width:34em}
.hero-cta{display:flex;gap:11px;flex-wrap:wrap;margin-top:24px}
.trust-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}

/* ---------- hero mock ---------- */
.mock{padding:16px}
.mock-head{display:flex;align-items:center;gap:9px;padding:2px 6px 12px}
.mock-dots{display:flex;gap:5px}
.mock-dots i{width:9px;height:9px;border-radius:50%;background:var(--surface-2);box-shadow:var(--clay-in)}
.mock-ttl{font-size:11.5px;font-weight:800;color:var(--ink-faint);letter-spacing:.04em}
.mock-body{padding:13px}
.mock-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.mock-tile{padding:11px 12px;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--clay-sm)}
.mock-tile .v{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.mock-tile .k{font-size:10px;font-weight:800;color:var(--ink-soft);margin-top:3px;line-height:1.3}
.mock-row{padding:14px 15px;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--clay-sm);margin-bottom:9px}
.mock-row:last-child{margin-bottom:0}
.mock-ref{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--accent-ink)}
html[dir="rtl"] .mock-ref{letter-spacing:.04em}
.mock-name{font-size:14px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
html[dir="rtl"] .mock-name{letter-spacing:0}
.mock-mile{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.mock-m{padding:9px 10px;border-radius:14px;background:var(--surface-2);box-shadow:var(--clay-in)}
.mock-m .mk{font-size:9.5px;font-weight:800;color:var(--ink-faint);margin-bottom:6px}
.chip-xs{padding:5px 10px;font-size:10.5px}

/* ---------- pain cards ---------- */
.pain-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.pain{padding:22px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--clay)}
.pain .emo{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(145deg,#fffaf7,var(--clay-blush));box-shadow:var(--clay-sm);margin-bottom:14px}
.pain h3{font-size:16px;line-height:1.35}
.pain p{margin-top:9px;font-size:13.5px;font-weight:600;color:var(--ink-soft);line-height:1.8}

/* ---------- features ---------- */
.feat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.feat{padding:22px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--clay);
  transition:transform .16s ease}
.feat:hover{transform:translateY(-3px)}
.feat .emo{font-size:26px;line-height:1;margin-bottom:12px}
.feat h3{font-size:16px;line-height:1.35}
.feat p{margin-top:9px;font-size:13.5px;font-weight:600;color:var(--ink-soft);line-height:1.8}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}

.also{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px;margin-top:16px}
.also div{padding:12px 15px;border-radius:var(--r-md);background:var(--surface-2);box-shadow:var(--clay-in);
  font-size:13px;font-weight:700;color:var(--ink-soft);line-height:1.6}

/* ---------- steps ---------- */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.step{padding:22px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--clay);position:relative}
.step .num{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:16px;font-weight:800;
  background:linear-gradient(145deg,#ff8f78,#ec4b2c);color:#fff;margin-bottom:14px;
  box-shadow:5px 5px 12px rgba(236,75,44,.3),inset 2px 2px 4px rgba(255,255,255,.35)}
.step h3{font-size:15.5px;line-height:1.35}
.step p{margin-top:8px;font-size:13.5px;font-weight:600;color:var(--ink-soft);line-height:1.8}

/* ---------- data / trust ---------- */
.data-wrap{display:grid;grid-template-columns:1.02fr .98fr;gap:22px;align-items:center}
.tree{padding:18px 20px;border-radius:var(--r-md);background:var(--surface-2);box-shadow:var(--clay-in);
  direction:ltr;text-align:left;font:700 12.5px/2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:var(--ink-soft);overflow-x:auto;white-space:pre}
.tick{list-style:none;margin:0;padding:0}
.tick li{display:flex;gap:11px;align-items:flex-start;padding:11px 0;font-size:14px;font-weight:600;
  color:var(--ink-soft);line-height:1.75}
.tick li b{color:var(--ink);font-weight:800}
.tick .ck{width:24px;height:24px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:11px;
  background:var(--ok-bg);color:#227353;font-weight:800;margin-top:2px}

/* ---------- form ---------- */
.form-wrap{max-width:620px;margin:0 auto}
.form-card{padding:28px;background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--clay)}
.cc-row{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:12px}
/* the dial code is a Latin token: force LTR in both directions so "+966" never
   gets reordered, and keep the chevron on the physical right where the text ends.
   Country flags are deliberately NOT in the option text — Windows has no flag
   glyphs and renders them as two bare letters. */
#f-cc{direction:ltr;text-align:left;font-size:13px;padding:14px 38px 14px 14px !important;
  background-position:right 13px center !important;text-overflow:ellipsis}
/* below this width the two boxes stack, so the country name is never clipped */
@media (max-width:560px){ .cc-row{grid-template-columns:minmax(0,1fr)} }
.fld-err{font-size:11.5px;font-weight:700;color:var(--danger);margin:6px 0 0;margin-inline-start:4px;

.form-foot{margin-top:16px}

.progress-line i{display:block;height:100%;border-radius:99px;width:0;

/* ---------- success ---------- */
.success{text-align:center}
.success .big{width:76px;height:76px;margin:0 auto 16px;border-radius:26px;display:grid;place-items:center;
  font-size:34px;background:linear-gradient(145deg,#d9f0e5,#a9dcc6);
  box-shadow:7px 7px 16px rgba(47,143,106,.28),-5px -5px 14px rgba(255,252,250,.9),
             inset 2px 2px 5px rgba(255,255,255,.7)}
.success h3{font-size:21px;line-height:1.3}
.success p{margin-top:10px;font-size:14px;font-weight:600;color:var(--ink-soft);line-height:1.8}
.next-steps{margin-top:20px;text-align:start}
.next-steps .ns{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);
  background:var(--surface-2);box-shadow:var(--clay-in);margin-bottom:9px;font-size:13px;font-weight:600;
  color:var(--ink-soft);line-height:1.7}
.next-steps .ns b{color:var(--ink);font-weight:800}
.next-steps .ns i{font-style:normal;font-size:16px;flex:none}

/* ---------- faq ---------- */
.faq{max-width:760px;margin:0 auto}
.faq-item{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--clay-sm);
  margin-bottom:11px;overflow:hidden}
.faq-item summary{list-style:none;cursor:pointer;padding:18px 20px;font-size:14.5px;font-weight:800;
  display:flex;align-items:center;gap:12px;letter-spacing:-.01em}
html[dir="rtl"] .faq-item summary{letter-spacing:0}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary:after{content:'+';margin-inline-start:auto;font-size:20px;font-weight:800;
  color:var(--accent-ink);flex:none;line-height:1;transition:transform .18s ease}
.faq-item[open] summary:after{transform:rotate(45deg)}
.faq-body{padding:0 20px 20px;font-size:13.5px;font-weight:600;color:var(--ink-soft);line-height:1.9}

/* ---------- upgrade / footer ---------- */
.up-card{padding:28px;border-radius:var(--r-xl);background:var(--surface);box-shadow:var(--clay);
  display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center}
.up-list{list-style:none;margin:0;padding:0}
.up-list li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:13px;font-weight:600;
  color:var(--ink-soft);line-height:1.7}
.up-list .ck{width:21px;height:21px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:10px;
  background:var(--accent-bg);color:var(--accent-ink);font-weight:800;margin-top:2px}
.lp-foot{margin-top:56px;padding-top:22px;text-align:center;font-size:12px;font-weight:600;color:var(--ink-faint);

.lp-foot a{color:var(--accent-ink);text-decoration:none;font-weight:800}
.lp-foot a:hover{text-decoration:underline}

/* ---------- responsive ---------- */
@media (max-width:900px){

@media (max-width:720px){

@media (prefers-reduced-motion:reduce){

  ar: ['برج النخيل — المرحلة ٢/',
       '├─ concrete_db.json      ← كل صبّة واختبار وحالة',
       '└─ attachments/          ← التقارير والموافقات والصور',
       '     ANT-014 d7 lab report.pdf',
       '     ANT-014 photo IMG_4471.jpg'].join('\n'),
  en: ['Al Nakheel Tower — Phase 2/',
       '├─ concrete_db.json      ← every pour, test and status',
       '└─ attachments/          ← reports, approvals, photos',
       '     ANT-014 d7 lab report.pdf',
       '     ANT-014 photo IMG_4471.jpg'].join('\n')
};

/* ============================================================================
   LANGUAGE
   ============================================================================ */
let lang = 'ar';

function detectLang(){
  try{
    const saved = localStorage.getItem('rbd_lp_lang');
    if(saved === 'ar' || saved === 'en') return saved;
  }catch(e){}
  if(DEFAULT_LANG === 'ar' || DEFAULT_LANG === 'en') return DEFAULT_LANG;
  const nav = (navigator.language || '').toLowerCase();
  return nav.startsWith('ar') ? 'ar' : 'en';
}

function t(k){ return (I18N[lang] && I18N[lang][k] != null) ? I18N[lang][k] : k; }

function setLang(l){
  lang = (l === 'en') ? 'en' : 'ar';
  try{ localStorage.setItem('rbd_lp_lang', lang); }catch(e){}
  applyLang();
}

function applyLang(){
  const html = document.documentElement;
  html.lang = lang;
  html.dir = (lang === 'ar') ? 'rtl' : 'ltr';

  document.querySelectorAll('[data-i]').forEach(el => {
    const v = I18N[lang][el.dataset.i];
    if(v != null) el.innerHTML = v;
  });
  document.querySelectorAll('[data-ph]').forEach(el => {
    const v = I18N[lang][el.dataset.ph];
    if(v != null) el.placeholder = v;
  });

  document.title = t('meta.title');
  setMeta('meta-desc', t('meta.desc'));
  setMeta('og-title',  t('meta.title'));
  setMeta('og-desc',   t('meta.desc'));

  document.getElementById('lang-ar').classList.toggle('on', lang === 'ar');
  document.getElementById('lang-en').classList.toggle('on', lang === 'en');

  document.getElementById('tree').textContent = TREE[lang];
  buildCountries();
  validate();               // re-render the button label + any visible errors
}

function setMeta(id, val){
  const el = document.getElementById(id);
  if(el) el.setAttribute('content', val);
}

/* ============================================================================
   COUNTRY SELECT
   ============================================================================ */
function buildCountries(){
  const sel = document.getElementById('f-cc');
  const keep = sel.value || '+966';
  sel.innerHTML = COUNTRIES
    .map(c => '<option value="' + c.c + '">' + c.c + '\u00a0\u00a0 ' + (lang === 'ar' ? c.ar : c.en) + '</option>')
    .join('');
  sel.value = keep;
  if(!sel.value) sel.value = '+966';
}

/* ============================================================================
   VALIDATION — the download button unlocks only when everything checks out
   ============================================================================ */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/;
const touched = {};
let submitted = false;

function digitsOf(s){ return (s || '').replace(/[^0-9]/g, ''); }

function checks(){
  const first = document.getElementById('f-first').value.trim();
  const last  = document.getElementById('f-last').value.trim();
  const phone = digitsOf(document.getElementById('f-phone').value);
  const email = document.getElementById('f-email').value.trim();
  return {
    first: first.length >= 2,
    last : last.length  >= 2,
    phone: phone.length >= 6 && phone.length <= 15,
    email: EMAIL_RE.test(email)
  };
}

function validate(){
  const ok = checks();
  const fields = [
    ['first', 'f-first', 'e-first', 'err.first'],
    ['last',  'f-last',  'e-last',  'err.last'],
    ['phone', 'f-phone', 'e-phone', 'err.phone'],
    ['email', 'f-email', 'e-email', 'err.email']
  ];

  fields.forEach(([key, inputId, errId, msgKey]) => {
    const input = document.getElementById(inputId);
    const err   = document.getElementById(errId);
    const show  = !ok[key] && (touched[key] || submitted) && input.value.trim() !== '';
    const showEmpty = !ok[key] && submitted && input.value.trim() === '';
    input.classList.toggle('bad', show || showEmpty);
    err.textContent = (show || showEmpty) ? t(msgKey) : '';
  });

  const done  = Object.values(ok).filter(Boolean).length;
  const all   = done === 4;
  document.getElementById('prog').style.width = (done / 4 * 100) + '%';

  const btn = document.getElementById('dl-btn');
  const txt = document.getElementById('dl-btn-txt');
  if(!btn.dataset.busy){
    btn.disabled = !all;
    txt.textContent = all ? t('form.btnReady') : t('form.btnLocked');
  }
  return all;
}

/* ============================================================================
   SEND THE LEAD, THEN DOWNLOAD — the download must never be blocked
   ============================================================================ */
/* One id per submission. The page may send the same lead twice (see sendLead:
   a cross-origin POST can reach the server even when reading the reply fails),
   so the id is what lets the sheet drop the second copy. */
function newLeadId(){
  try{ if(crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return 'lead-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

function payload(){
  const cc    = document.getElementById('f-cc').value;
  const phone = digitsOf(document.getElementById('f-phone').value);
  return {
    leadId     : newLeadId(),
    firstName  : document.getElementById('f-first').value.trim(),
    lastName   : document.getElementById('f-last').value.trim(),
    countryCode: cc,
    phone      : phone,
    fullPhone  : cc + phone,
    email      : document.getElementById('f-email').value.trim(),
    company    : document.getElementById('f-company').value.trim(),
    language   : lang,
    source     : 'free-tool-landing',
    page       : location.href,
    referrer   : document.referrer || '',
    userAgent  : navigator.userAgent,
    build      : BUILD
  };
}

async function sendLead(data){
  if(!SHEET_ENDPOINT){
    console.warn('[Rabaed] SHEET_ENDPOINT is empty — lead was not sent:', data);
    return 'skipped';
  }
  const body = JSON.stringify(data);
  const opts = { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body, redirect:'follow' };

  try{
    const r = await fetch(SHEET_ENDPOINT, opts);
    if(r.ok) return 'ok';
    throw new Error('HTTP ' + r.status);
  }catch(err){
    try{
      await fetch(SHEET_ENDPOINT, Object.assign({}, opts, {mode:'no-cors'}));
      return 'opaque';
    }catch(err2){
      try{
        const sent = navigator.sendBeacon(SHEET_ENDPOINT, new Blob([body], {type:'text/plain;charset=utf-8'}));
        return sent ? 'beacon' : 'failed';
      }catch(err3){ return 'failed'; }
    }
  }
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function triggerDownload(){
  const a = document.createElement('a');
  a.href = TOOL_FILE;
  a.download = DOWNLOAD_NAME;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => a.remove(), 1500);
}

function toast(msg){
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

async function onSubmit(e){
  e.preventDefault();
  submitted = true;
  if(!validate()){
    const bad = document.querySelector('.input.bad');
    if(bad) bad.focus();
    return;
  }

  const btn = document.getElementById('dl-btn');
  const txt = document.getElementById('dl-btn-txt');
  btn.dataset.busy = '1';
  btn.disabled = true;
  txt.textContent = t('form.btnBusy');

  const data   = payload();
  /* the logging call gets 8 seconds; after that the download goes ahead regardless */
  const result = await Promise.race([ sendLead(data), sleep(8000).then(() => 'timeout') ]);
  console.log('[Rabaed] lead delivery:', result);

  triggerDownload();
  toast(result === 'failed' ? t('toast.err') : t('toast.ok'));

  document.getElementById('form-view').classList.add('hidden');
  document.getElementById('done-view').classList.remove('hidden');
  document.getElementById('done-view').scrollIntoView({block:'center', behavior:'smooth'});

  delete btn.dataset.busy;
}

/* ============================================================================
   BOOT
   ============================================================================ */
(function boot(){
  if(LOGO_RABAED.slice(0, 5) === 'data:'){
    document.getElementById('brand-mark').innerHTML =
      '<img src="' + LOGO_RABAED + '" alt="Rabaed">';
  }

  document.getElementById('up-cta').href = UPGRADE_URL;
  document.getElementById('build-tag').textContent = BUILD;

  const again = document.getElementById('dl-again');
  again.href = TOOL_FILE;
  again.setAttribute('download', DOWNLOAD_NAME);

  ['f-first','f-last','f-phone','f-email','f-company'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', validate);
    el.addEventListener('blur', () => {
      touched[id.replace('f-','')] = true;
      validate();
    });
  });
  document.getElementById('f-cc').addEventListener('change', validate);
  document.getElementById('lead-form').addEventListener('submit', onSubmit);

  lang = detectLang();
  applyLang();
})();

</script>
