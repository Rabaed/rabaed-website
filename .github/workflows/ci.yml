# The check that stands between a pull request and `main`.
#
# It builds the application and runs the end-to-end suite against the build —
# the one seam the spec tests at. Nothing here runs against the dev server, and
# nothing is mocked: if this is green, the built site behaved.
#
# Not run here: `npm run baselines:verify`. The visual baselines are pixel
# comparisons, and text rasterisation differs between the machine that captured
# them and a hosted Linux runner, so a run on this runner would fail for
# reasons that have nothing to do with the change. Comparing the rebuild
# against the baselines is a local step until a pinned rendering environment
# exists for it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Chromium only: it is the browser the suite runs in and the one the
      # visual baselines were captured with.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Next.js keeps compiled output in `.next/cache` and reuses it on the next
      # build. A hosted runner starts empty, so carry it between runs. The key
      # is new on every commit, so each run saves what it built; the restore
      # key falls back to the latest cache for the same lockfile, which is what
      # the build actually starts from. An older cache is safe: Next.js
      # rebuilds whatever changed.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # Builds the application and serves it — see playwright.config.ts.
      #
      # `@pixel` is skipped. Those tests compare a committed image against a
      # fresh render of it, and text rasterises differently here than on the
      # machine that exported it, so they can only pass where the image was
      # made — this runner failed all eight the first time they ran. What
      # replaces them here is the check that each image was exported from the
      # markup as it currently stands, which is machine-independent.
      - name: End-to-end tests
        run: npm test -- --grep-invert @pixel

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
